    </linearGradient>
    <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="60" y2="60">
      <stop offset="0" stop-color="#4285F4"><animate attributeName="stop-color" dur="6s" begin="-6.0s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1" values="#4285F4;#EA4335;#FBBC05;#34A853;#4285F4"/></stop>
      <stop offset="1" stop-color="#EA4335"><animate attributeName="stop-color" dur="6s" begin="-6.0s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1" values="#EA4335;#FBBC05;#34A853;#4285F4;#EA4335"/></stop>
    </linearGradient>
  </defs>

