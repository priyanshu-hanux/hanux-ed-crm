<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345.6 64" width="345.6" height="64" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Loading</title>
  <style>
    /* One 6s cycle per letter, with the letters a little staggered:
         0%  – 24%  dot bounces twice
         24% – 30%  dot glides onto the letter's outline and shrinks to stroke size
         30% – 55%  the dot stretches out along the outline until the letter is drawn
         55% – 70%  full letter holds
         70% – 92%  the line winds up around the outline back into a dot
         92% – 100% the dot glides back into the row, and it repeats
       --s is where on the outline (0–360) the dot joins the letter;
       --dx / --dy is that same point, measured from the dot's home. */

    svg { overflow: visible; }

    .dot, .letter {
      animation-duration: 6s;
      animation-delay: calc(var(--i) * 0.08s);
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }

    .dot {
      fill: var(--g);
      transform-box: view-box;
      transform-origin: 32px 32px;
      animation-name: dot;
    }

    .letter {
      fill: none;
      stroke: var(--g);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation-name: letter;
    }

    @keyframes dot {
      0%     { translate: 0 0;     scale: 1; opacity: 1; animation-timing-function: cubic-bezier(.3,0,.6,1); }
      6%     { translate: 0 -14px; animation-timing-function: cubic-bezier(.4,0,.7,1); }
      12%    { translate: 0 0;     animation-timing-function: cubic-bezier(.3,0,.6,1); }
      18%    { translate: 0 -14px; animation-timing-function: cubic-bezier(.4,0,.7,1); }
      24%    { translate: 0 0;     scale: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
      30%    { translate: var(--dx) var(--dy); scale: .667; opacity: 1; }
      30.1%, 91.9% { translate: var(--dx) var(--dy); scale: .667; opacity: 0; }
      92%    { translate: var(--dx) var(--dy); scale: .667; opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
      100%   { translate: 0 0;     scale: 1; opacity: 1; }
    }

    @keyframes letter {
      0%, 30% { opacity: 0; stroke-dasharray: 0.1 359.9; stroke-dashoffset: calc(var(--s) * -1); }
      30.1%   { opacity: 1; stroke-dasharray: 0.1 359.9; stroke-dashoffset: calc(var(--s) * -1);
                animation-timing-function: cubic-bezier(.65,0,.35,1); }
      55%, 70% { opacity: 1; stroke-dasharray: 360 0; stroke-dashoffset: calc(var(--s) * -1);
                animation-timing-function: cubic-bezier(.65,0,.35,1); }
      91.9%   { opacity: 1; stroke-dasharray: 0.1 359.9; stroke-dashoffset: calc((var(--s) + 360) * -1); }
      92%, 100% { opacity: 0; stroke-dasharray: 0.1 359.9; stroke-dashoffset: calc((var(--s) + 360) * -1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0; }
      .letter { animation: none; }
    }
  </style>

  <!-- Gradients: each letter blends two palette colors, and both colors
       keep moving through blue → red → yellow → green. -->
