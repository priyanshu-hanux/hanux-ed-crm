      <stop offset="1" stop-color="#34A853"><animate attributeName="stop-color" dur="6s" begin="-3.0s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1" values="#EA4335;#FBBC05;#34A853;#4285F4;#EA4335"/></stop>
    </linearGradient>
    <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="60" y2="60">
